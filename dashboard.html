<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Web</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

    <div id="loading" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Cargando dashboard...</p>
    </div>

    <nav class="dash-tabs" id="dashTabs" style="display: none;">
    <a href="#" class="tab active" data-seccion="fuerza"><i class="fas fa-users"></i> Fuerza Laboral</a>
    <a href="#" class="tab" data-seccion="semanal"><i class="fas fa-calendar-week"></i> Reporte Semanal</a>
    <a href="#" class="tab" data-seccion="residencia"><i class="fas fa-house-user"></i> Residencia</a>
</nav>

    <!-- SECCIÓN 1: FUERZA LABORAL -->
    <div id="fuerza" class="dashboard-section" style="display: none;">
        <header class="exec-header">
            <div class="exec-title">
                <div class="exec-logo"><i class="fas fa-users"></i></div>
                <div>
                    <h1>Fuerza Laboral</h1>
                    <span class="exec-subtitle">Personal en obra · Activos · Descanso</span>
                </div>
            </div>
            <div class="exec-actions">
                <span class="exec-date"><i class="fas fa-calendar-alt"></i> <span id="fechaActual1"></span></span>
            </div>
        </header>

        <section class="kpi-row" id="kpiFuerza"></section>

        <section class="filters-row">
            <div class="filter-chip"><i class="fas fa-id-badge"></i>
                <select id="filterRegimenF" class="filter-select"><option value="">Régimen</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-user-tag"></i>
                <select id="filterTipoF" class="filter-select"><option value="">Tipo Empleado</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-building"></i>
                <select id="filterEmpresaF" class="filter-select"><option value="">Empresa</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-user-cog"></i>
                <select id="filterCondF" class="filter-select"><option value="">Condición</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-project-diagram"></i>
                <select id="filterCCF" class="filter-select"><option value="">Centro Costo</option></select>
            </div>
            <button id="clearFuerza" class="btn-clear-chips"><i class="fas fa-eraser"></i> Limpiar</button>
        </section>

        <section class="charts-exec" id="chartsFuerza"></section>
    </div>

    <!-- SECCIÓN 2: REPORTE SEMANAL -->
    <div id="semanal" class="dashboard-section" style="display: none;">
        <header class="exec-header">
            <div class="exec-title">
                <div class="exec-logo"><i class="fas fa-calendar-week"></i></div>
                <div>
                    <h1>Reporte Semanal</h1>
                    <span class="exec-subtitle">Personal por semana · Género · Gerencia</span>
                </div>
            </div>
            <div class="exec-actions">
                <span class="exec-date"><i class="fas fa-calendar-alt"></i> <span id="fechaActual2"></span></span>
            </div>
        </header>

        <section class="kpi-row" id="kpiSemanal"></section>

        <section class="filters-row">
            <div class="filter-chip"><i class="fas fa-calendar-week"></i>
                <select id="filterSemanaS" class="filter-select"><option value="">Semana</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-calendar"></i>
                <select id="filterMesS" class="filter-select"><option value="">Mes</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-venus-mars"></i>
                <select id="filterGeneroS" class="filter-select"><option value="">Género</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-user-clock"></i>
                <select id="filterSituacionS" class="filter-select"><option value="">Situación</option></select>
            </div>
            <div class="filter-chip"><i class="fas fa-sitemap"></i>
                <select id="filterGerenciaS" class="filter-select"><option value="">Gerencia</option></select>
            </div>
            <button id="clearSemanal" class="btn-clear-chips">
    <i class="fas fa-eraser"></i> Limpiar
</button>
        </section>

        <section class="charts-exec" id="chartsSemanal"></section>
    </div>
<!-- SECCIÓN 3: RESIDENCIA -->
<div id="residencia" class="dashboard-section" style="display: none;">
    <header class="exec-header">
        <div class="exec-title">
            <div class="exec-logo"><i class="fas fa-house-user"></i></div>
            <div>
                <h1>Residencia</h1>
                <span class="exec-subtitle">Local · Foráneo · Extranjero · Proyectos · Operaciones</span>
            </div>
        </div>
        <div class="exec-actions">
            <span class="exec-date"><i class="fas fa-calendar-alt"></i> <span id="fechaActual3"></span></span>
        </div>
    </header>

    <section class="kpi-row" id="kpiResidencia"></section>

    <section class="filters-row">
        <div class="filter-chip"><i class="fas fa-toggle-on"></i>
            <select id="filterStatusR" class="filter-select"><option value="">Status</option></select>
        </div>
        <div class="filter-chip"><i class="fas fa-comment-dots"></i>
            <select id="filterObsR" class="filter-select"><option value="">Observaciones</option></select>
        </div>
        <div class="filter-chip"><i class="fas fa-building"></i>
            <select id="filterEmpresaR" class="filter-select"><option value="">Empresa</option></select>
        </div>
        <button id="clearResidencia" class="btn-clear-chips"><i class="fas fa-eraser"></i> Limpiar</button>
    </section>

    <section class="charts-exec" id="chartsResidencia"></section>
</div>
    <script src="js/dashboard.js"></script>
</body>
</html>
